name: Release

# Two ways to release:
# - Actions → Release → Run workflow, with a version such as 0.2.0. The
#   workflow sets it in mygo.config.ts, commits, tags v0.2.0 and builds.
# - Push a tag yourself: git tag v0.2.0 && git push origin v0.2.0. Set the
#   same version in mygo.config.ts first.
# Either way the builds land in a draft release, which you review and publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Bump the version and tag it
        id: tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION is not a version like 1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION already exists"; exit 1
          fi
          sed -i -E "s/version: \"[^\"]+\"/version: \"$VERSION\"/" mygo.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  draft-release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A version such as 0.4.0-beta.1 is a pre-release: the updater
            # doesn't offer it, so only people who install it by hand get it.
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "cuteimg $TAG" --generate-notes $pre
          fi

  build:
    needs: [prepare, draft-release]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows and Linux, os: ubuntu-latest, platform: "windows/amd64,linux/amd64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build, sign the updates and upload them to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          # Keep only the base64 key: a secret pasted from Windows can carry a BOM or a line ending.
          export MYGO_UPDATER_PRIVATE_KEY="$(printf %s "$SIGNING_KEY" | tr -cd 'A-Za-z0-9+/=')"
          bun run build -- -platform "${{ matrix.platform }}" -upload
      - name: Upload the portable Windows app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if [ -f build/windows-amd64/cuteimg.exe ]; then
            cp build/windows-amd64/cuteimg.exe build/cuteimg-portable-amd64.exe
            gh release upload "$TAG" build/cuteimg-portable-amd64.exe --clobber
          fi
