name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows and Linux, os: ubuntu-latest, platform: "windows/amd64,linux/amd64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: bun run build -- -platform "${{ matrix.platform }}"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=()
          if [ -f build/windows-amd64/cuteimg.exe ]; then
            cp build/windows-amd64/cuteimg.exe build/cuteimg-portable-amd64.exe
            files+=(build/cuteimg-portable-amd64.exe)
          fi
          while IFS= read -r f; do files+=("$f"); done < <(find build -maxdepth 2 -type f \( -name '*Setup*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' \))
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
