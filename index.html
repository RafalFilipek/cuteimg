<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>
<title>cuteimg</title>
<style>
/* Layout: tools on top, checkerboard stage in the middle, background panel on the right (below on phones) */
:root {
  --bg: #eef0f4;
  --panel: #ffffff;
  --line: #dfe2ea;
  --fg: #1b1e27;
  --muted: #6a7083;
  --accent: #3b5bfd;
  --accent-fg: #ffffff;
  --hover: #f1f3f8;
  --scroll: #c9cdd8;
  --check-a: #e4e6ec;
  --check-b: #f4f5f8;
  --font-ui: "Onest", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13151b; --panel: #1c1f27; --line: #2c303b; --fg: #e9ebf1; --muted: #9298a8;
  --accent: #7088ff; --accent-fg: #0d0f15; --hover: #252934; --scroll: #3a3f4d; --check-a: #20232b; --check-b: #181a20; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13151b; --panel: #1c1f27; --line: #2c303b; --fg: #e9ebf1; --muted: #9298a8;
  --accent: #7088ff; --accent-fg: #0d0f15; --hover: #252934; --scroll: #3a3f4d; --check-a: #20232b; --check-b: #181a20; color-scheme: dark; }

html, body { height: 100%; }
body { -webkit-user-select: none; user-select: none; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: .02em; margin-right: 6px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #ff7a59, #b14bff); display: inline-block; }
.group { flex: none; display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 8px; justify-content: center;
  border: 0; background: transparent; border-radius: 8px; cursor: pointer; white-space: nowrap; flex: none;
}
.tbtn:hover { background: var(--hover); }
.tbtn:focus-visible, .sw:focus-visible, .preset:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.tbtn svg { width: 18px; height: 18px; flex: none; }
.tbtn kbd { font-family: var(--font-num); font-size: 10px; opacity: .6; }
.tbtn:disabled { opacity: .35; cursor: default; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; margin: 0 2px; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.spacer { flex: 1; }
.primary { background: var(--accent); color: var(--accent-fg); }
.primary:hover { background: var(--accent); filter: brightness(1.08); }

.main { flex: 1; display: flex; min-height: 0; }
.stage {
  flex: 1; min-width: 0; position: relative; display: grid; place-items: center; overflow: hidden;
  padding: 24px max(16px, env(safe-area-inset-left, 0px));
  background-color: var(--check-b);
  background-image: linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%),
                    linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%);
  background-size: 20px 20px; background-position: 0 0, 10px 10px;
}
#cv { display: block; touch-action: none; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.stage.drag::after { content: "Drop an image"; position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px; display: grid; place-items: center; font-size: 18px; font-weight: 600; background: color-mix(in srgb, var(--panel) 80%, transparent); }
.sample-tag { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.sample-tag b { color: var(--fg); font-weight: 600; }

.side {
  width: 264px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  padding-block: 16px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.presets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.preset { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; padding: 0; position: relative; }
.preset[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.preset.none { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0/10px 10px; }
.preset.custom { overflow: hidden; }
.preset.custom input { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); border: 0; padding: 0; cursor: pointer; opacity: 0; }
.preset.custom span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin-bottom: 12px; }
.row label { font-size: 13px; }
.row output { font-family: var(--font-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.fold summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-radius: 6px; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary h2 { margin: 0; }
.fold summary svg { width: 16px; height: 16px; color: var(--muted); transform: rotate(-90deg); transition: transform .15s; }
.fold[open] summary svg { transform: none; }
.fold[open] summary { margin-bottom: 10px; }
.fold summary:hover h2, .fold summary:hover svg { color: var(--fg); }
.fold summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.seg button { height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12.5px; cursor: pointer; }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--line); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
* { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
::-webkit-scrollbar-corner { background: transparent; }
@media (prefers-reduced-motion: reduce) { .fold summary svg { transition: none; } }
.keys { margin: 0; display: grid; gap: 2px; }
.keys > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.keys > div:last-child { border-bottom: 0; }
.keys > div.featured { padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--hover); }
.keys dt { font-size: 12.5px; color: var(--muted); min-width: 0; }
.keys > div.featured dt { color: var(--fg); font-weight: 600; }
.keys dd { margin: 0; display: flex; gap: 3px; align-items: center; flex: none; }
.keys kbd { font-family: var(--font-num); font-size: 10.5px; line-height: 1; min-width: 20px; text-align: center; padding: 4px 5px 3px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--fg); }
.keys .hold { font-size: 11px; color: var(--muted); margin-right: 2px; }
.credit { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.credit p { margin: 0; font-size: 12px; color: var(--muted); }
.credit a { color: inherit; text-decoration: none; }
.credit a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.credit a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.meta { margin: 4px 0 0; font-family: var(--font-num); font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(8px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 760px) {
  body { overflow: auto; height: auto; }
  .main { flex-direction: column; }
  .stage { min-height: 56vh; }
  .side { width: auto; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .tbtn kbd, .lbl { display: none; }
}
</style>

<header class="bar" role="toolbar" aria-label="Tools">
  <div class="brand"><i aria-hidden="true"></i>cuteimg</div>
  <div class="group" id="tools">
    <button class="tbtn" data-tool="select" title="Select and move (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><kbd>V</kbd></button>
    <button class="tbtn" data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5M10 5h9v9"/></svg><kbd>A</kbd></button>
    <button class="tbtn" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="2"/></svg><kbd>R</kbd></button>
    <button class="tbtn" data-tool="ellipse" title="Circle / ellipse (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="7"/></svg><kbd>O</kbd></button>
    <button class="tbtn" data-tool="pixel" title="Pixelate (P)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="5" height="5"/><rect x="14" y="4" width="5" height="5" opacity=".5"/><rect x="9" y="9" width="5" height="5" opacity=".75"/><rect x="4" y="14" width="5" height="5" opacity=".5"/><rect x="14" y="14" width="5" height="5"/></svg><kbd>P</kbd></button>
  </div>
  <div class="group" id="colors" aria-label="Color"></div>
  <div class="group" id="widths" aria-label="Thickness">
    <button class="tbtn" data-w="4" title="Thin"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="tbtn" data-w="7" title="Medium"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <button class="tbtn" data-w="12" title="Thick"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></button>
  </div>
  <div class="group">
    <button class="tbtn" id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="tbtn" id="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="tbtn" id="del" title="Delete selected (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="spacer"></div>
  <button class="tbtn" id="open" title="Open file (Ctrl+O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7h7l2 2h9v10H3z"/></svg><span class="lbl">Open</span></button>
  <button class="tbtn" id="copy" title="Copy image (Ctrl+C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg><span class="lbl">Copy</span></button>
  <button class="tbtn primary" id="save" title="Save PNG (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Save PNG</span></button>
  <input type="file" id="file" accept="image/*" hidden>
</header>

<div class="main">
  <div class="stage" id="stage">
    <canvas id="cv" width="10" height="10" aria-label="Screenshot being edited"></canvas>
    <div class="sample-tag" id="sampleTag">Example. <b>Paste your screenshot: Ctrl+V</b></div>
  </div>
  <aside class="side">
    <section>
      <h2>Background</h2>
      <div class="presets" id="presets"></div>
      <label class="check" for="grain"><input type="checkbox" id="grain"> Grain</label>
    </section>
    <section>
      <div class="row"><label for="pad">Padding</label><output id="padOut"></output><input type="range" id="pad" min="0" max="240" step="4"></div>
      <div class="row"><label for="rad">Corner radius</label><output id="radOut"></output><input type="range" id="rad" min="0" max="48" step="1"></div>
      <div class="row"><label for="shd">Shadow</label><output id="shdOut"></output><input type="range" id="shd" min="0" max="100" step="5"></div>
    </section>
    <section>
      <h2>Pixelate</h2>
      <div class="row"><label for="blk">Block size</label><output id="blkOut"></output><input type="range" id="blk" min="4" max="40" step="2"></div>
      <p class="meta" id="meta"></p>
    </section>
    <details class="fold" id="keysFold">
      <summary><h2>Shortcuts</h2><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <dl class="keys" id="keys">
        <div><dt>Paste a screenshot</dt><dd><kbd>Ctrl</kbd><kbd>V</kbd></dd></div>
        <div><dt>Windows snip</dt><dd><kbd>Win</kbd><kbd>Shift</kbd><kbd>S</kbd></dd></div>
        <div><dt>Square, circle, 45°</dt><dd><span class="hold">hold</span><kbd>Shift</kbd></dd></div>
        <div><dt>Tools</dt><dd><kbd>V</kbd><kbd>A</kbd><kbd>R</kbd><kbd>O</kbd><kbd>P</kbd></dd></div>
        <div><dt>Undo</dt><dd><kbd>Ctrl</kbd><kbd>Z</kbd></dd></div>
        <div><dt>Copy result</dt><dd><kbd>Ctrl</kbd><kbd>C</kbd></dd></div>
        <div><dt>Save PNG</dt><dd><kbd>Ctrl</kbd><kbd>S</kbd></dd></div>
      </dl>
    </details>
    <section>
      <h2>Appearance</h2>
      <div class="seg" id="themeSeg" role="radiogroup" aria-label="Theme">
        <button role="radio" data-theme-opt="system">System</button>
        <button role="radio" data-theme-opt="light">Light</button>
        <button role="radio" data-theme-opt="dark">Dark</button>
      </div>
    </section>
    <footer class="credit">
      <p>© <a href="https://github.com/RafalFilipek/cuteimg" target="_blank" rel="noopener">Rafał Filipek</a></p>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const $ = (s) => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
const COLORS = ["#ff3b30", "#ff9500", "#ffcc00", "#34c759", "#0a84ff", "#af52de", "#1c1c1e", "#ffffff"];
const M = (base, ...blobs) => ({ base, blobs });
const PRESETS = [
  { id: "aurora", name: "Aurora", mesh: M("#0b1030", [0.15, 0.2, 0.7, "#00e0b8"], [0.85, 0.15, 0.65, "#7a3cff"], [0.6, 0.95, 0.8, "#00a3ff"], [0.1, 0.9, 0.5, "#c04dff"]) },
  { id: "lava", name: "Lava", mesh: M("#ff5e3a", [0.1, 0.1, 0.7, "#ffcf3a"], [0.9, 0.2, 0.6, "#ff2e7e"], [0.5, 1, 0.75, "#a01cff"], [0.05, 0.95, 0.5, "#ff8a00"]) },
  { id: "candy", name: "Candy", mesh: M("#ffd6f0", [0.1, 0.15, 0.6, "#ff8fd8"], [0.9, 0.1, 0.6, "#8fd3ff"], [0.85, 0.9, 0.7, "#c7a2ff"], [0.15, 0.95, 0.6, "#ffe48f"]) },
  { id: "lagoon", name: "Lagoon", mesh: M("#00b4d8", [0.1, 0.1, 0.7, "#90f1c8"], [0.95, 0.3, 0.6, "#0077ff"], [0.3, 1, 0.7, "#00e5ff"], [0.8, 0.95, 0.5, "#3a0ca3"]) },
  { id: "dusk", name: "Dusk", mesh: M("#2a1a5e", [0.2, 0.85, 0.8, "#ff6f61"], [0.9, 0.9, 0.6, "#ffb347"], [0.75, 0.1, 0.7, "#5f2cff"], [0.1, 0.1, 0.5, "#1a0b3d"]) },
  { id: "neon", name: "Neon", mesh: M("#070712", [0.0, 0.0, 0.75, "#ff00c8"], [1, 1, 0.75, "#00f0ff"], [1, 0, 0.45, "#7a00ff"], [0, 1, 0.45, "#0038ff"]) },
  { id: "holo", name: "Holo", mesh: M("#e8e3ff", [0.05, 0.3, 0.6, "#a0fff0"], [0.5, 0.0, 0.55, "#ffb3f5"], [0.95, 0.5, 0.6, "#b3c6ff"], [0.4, 1, 0.6, "#fff3a0"]) },
  { id: "forest", name: "Forest", mesh: M("#0f3d2e", [0.15, 0.15, 0.7, "#5be38a"], [0.9, 0.3, 0.6, "#0ea5a0"], [0.6, 1, 0.7, "#c8f560"], [0, 1, 0.5, "#064e3b"]) },
  { id: "peach", name: "Peach", mesh: M("#ffb38a", [0.1, 0.1, 0.65, "#fff1a8"], [0.95, 0.25, 0.6, "#ff7aa2"], [0.5, 1, 0.7, "#ff9a5c"]) },
  { id: "ice", name: "Ice", mesh: M("#dbeafe", [0.1, 0.2, 0.6, "#ffffff"], [0.9, 0.1, 0.6, "#93c5fd"], [0.7, 1, 0.7, "#c4b5fd"], [0.05, 0.95, 0.5, "#a5f3fc"]) },
  { id: "sunset", name: "Sunset", stops: ["#ff9a8b", "#ff6a88", "#ff99ac"] },
  { id: "violet", name: "Violet", stops: ["#a18cd1", "#6a3df0"] },
  { id: "ocean", name: "Ocean", stops: ["#43cbff", "#3b5bfd"] },
  { id: "rainbow", name: "Rainbow", conic: ["#ff5f6d", "#ffc371", "#47e891", "#3fa9ff", "#b06bff", "#ff5f6d"] },
  { id: "night", name: "Night", stops: ["#30344a", "#121420"] },
  { id: "white", name: "White", solid: "#ffffff" },
  { id: "none", name: "No background", none: true },
  { id: "custom", name: "Custom color", custom: true },
];

const store = {
  get(k, d) { try { const v = localStorage.getItem("cuteimg." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cuteimg." + k, JSON.stringify(v)); } catch {} },
};

const st = {
  img: null, isSample: true,
  shapes: [], sel: -1,
  tool: "arrow", color: COLORS[0], width: 7,
  bg: store.get("bg", "aurora"), grain: store.get("grain", true), customColor: store.get("customColor", "#5b6cff"),
  pad: store.get("pad", 64), rad: store.get("rad", 12), shadow: store.get("shadow", 40), block: store.get("block", 14),
  hist: ["[]"], hi: 0,
};

// ---------- geometry ----------
const norm = (s) => ({ x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) });
const outW = () => st.img.width + st.pad * 2, outH = () => st.img.height + st.pad * 2;
function cssScale() { const r = cv.getBoundingClientRect(); return r.width ? cv.width / r.width : 1; }
